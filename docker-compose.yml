services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment_engine
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: 2settle
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
