# Both services use the Linux VPS network to reach host PostgreSQL.
services:
  server:
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
    env_file:
      - .env
    network_mode: host

  ratefetcher:
    build:
      context: .
      dockerfile: cmd/ratefetcher/Dockerfile
    env_file:
      - .env
    network_mode: host
    environment:
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
