# The sandbox environment (docs/SANDBOX_PLAN.md): a second, fully
# independent deployment of the same two services docker-compose.yml runs,
# against the native host Postgres's 2settle_sandbox database (not a
# bundled container) — SANDBOX_MODE (.env.sandbox) is what actually
# switches server-sandbox's providers to fakes. `name:` below pins the
# compose project name so this stack (containers, network) never collides
# with or gets merged into the plain `docker-compose.yml` stack, even
# though both files live in the same directory — run with:
#   docker compose -f docker-compose.sandbox.yml up -d
#
# Same extra_hosts mechanism as docker-compose.yml: makes "localhost"
# inside each container resolve to the host machine (Docker Desktop's
# host-gateway), so .env.sandbox's own DATABASE_URL (localhost:5432,
# 2settle_sandbox) works unmodified whether you run `go run ./cmd/...` on
# the host or inside Docker — no per-service override needed.
name: payment-engine-v2-sandbox

services:
  server-sandbox:
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
    env_file:
      - .env.sandbox
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      # Host port 3701 — distinct from the main stack's server on 3700, so
      # a tenant can point sandbox.2settle.io's reverse proxy here later
      # (Phase 3) while api.2settle.io keeps talking to the main stack.
      - "3701:3700"

  ratefetcher-sandbox:
    build:
      context: .
      dockerfile: cmd/ratefetcher/Dockerfile
    env_file:
      - .env.sandbox
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      # Deliberately the exact same mechanism the main stack's ratefetcher
      # uses to keep provider_rates warm — sandbox rates are not
      # special-cased or hardcoded (see .env.sandbox's rate engine comment).
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
